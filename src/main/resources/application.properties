# =======================================================
# MediCare Appointment System - Spring Boot Configuration
# =======================================================

# Server Port
server.port=8080

# -------------------------------------------------------
# DATABASE CONFIGURATION (Default: MySQL)
# -------------------------------------------------------
# Ensure MySQL is running on localhost:3306 and database 'medicare' is created:
# CREATE DATABASE medicare;
spring.datasource.url=jdbc:mysql://localhost:3306/medicare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------
# JPA & HIBERNATE CONFIGURATION
# -------------------------------------------------------
# Automatically create / update tables from JPA entity classes:
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Execute schema.sql and data.sql if database tables are empty
spring.sql.init.mode=always

# -------------------------------------------------------
# OPTIONAL ZERO-SETUP H2 IN-MEMORY MODE (FOR COLLEGE VIVA DEMO)
# -------------------------------------------------------
# If MySQL is not installed on the presentation machine,
# uncomment the lines below and comment the MySQL lines above:
#
# spring.datasource.url=jdbc:h2:mem:medicare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
